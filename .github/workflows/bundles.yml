name: bundles

# Builds the per-task source bundles (every text file of the repo at base_commit, gzipped
# JSON) and publishes them on GitHub Pages, which serves them with CORS enabled. Set the
# app's BUNDLE_BASE_URL to https://<owner>.github.io/<repo>/bundles.

on:
  push:
    branches: [main]
    paths: ["data/tasks.json", "scripts/build-bundles.ts"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:bundles --out _site/bundles
      - name: Index page
        run: |
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>areyoubetterthan.ai bundles</title>
          <p>Source bundles for <a href="https://areyoubetterthan.ai">areyoubetterthan.ai</a>. See <a href="bundles/index.json">index.json</a>.</p>
          HTML
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
